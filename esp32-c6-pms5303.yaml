# Board: Seeed Studio XIAO ESP32C6 (Seeed Studio)
# Definition: definitions/boards/seeed_xiao_esp32c6/manifest.yaml

esphome:
  name: esp32-c6-pms5303
  friendly_name: ESP32 C6 + PMS5303

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: ""

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ESP32 C6 + PMS5 Fallback Hotspot
    password: ""

mqtt:
  broker: 
  port: 8883
  username: 
  password: ""

  certificate_authority: ""
  
captive_portal:


# PMS5303 UART
# PMS5303 TXD -> XIAO D7 / GPIO17 (RX)
# PMS5303 RXD -> XIAO D6 / GPIO16 (TX)

uart:
  id: uart_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

globals:
  - id: pms_readings_count
    type: int
    restore_value: no
    initial_value: '0'


sensor:
  - platform: pmsx003
    uart_id: uart_uart
    type: PMSX003
    update_interval: 3min

    pm_1_0:
      name: "PMS5303 PM1.0"
      id: pm1_0
      filters:
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1

    pm_2_5:
      name: "PMS5303 PM2.5"
      id: pm2_5
      filters:
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1

    pm_10_0:
      name: "PMS5303 PM10"
      id: pm10
      filters:
        - median:
            window_size: 5
            send_every: 1
            send_first_at: 1


interval:
  - interval: 3min
    then:
      - lambda: |-
          if (id(pms_readings_count) < 5) {
            id(pms_readings_count)++;
          }

      - if:
          condition:
            lambda: 'return id(pms_readings_count) >= 5;'
          then:
            - mqtt.publish_json:
                topic: sensors/air_quality/pms5303
                payload: |-
                  root["sensor"] = "PMS5303";
                  root["pm1_0"] = id(pm1_0).state;
                  root["pm2_5"] = id(pm2_5).state;
                  root["pm10"] = id(pm10).state;
